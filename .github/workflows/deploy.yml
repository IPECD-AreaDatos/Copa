name: Deploy to Server

on:
  push:
    branches: [ main ]

concurrency:
  group: copa-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          command_timeout: 20m
          script: |
            set -eu
            export PATH="$HOME/.nvm/versions/node/v20.20.0/bin:$PATH"
            node --version
            npm --version

            cd ${{ secrets.PROJECT_PATH }}

            git fetch origin main
            git reset --hard origin/main

            cd apps/api
            npm ci --omit=dev
            npm test

            cd ../web
            npm ci
            npm run build

            cd ../..
            node apps/api/scripts/configure-auth.js
            node apps/api/scripts/migrate-access.js
            pm2 restart copa-api
            pm2 restart copa-web

            curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-all-errors \
              http://127.0.0.1:4000/api/health
            curl --fail --silent --show-error --output /dev/null --retry 10 --retry-delay 2 --retry-all-errors \
              http://127.0.0.1:3006/copa/login
            node apps/api/scripts/activate-institution-users.js
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
